<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RishantChat</title>
  <link rel="icon" href="logo.png" type="image/png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    html, body { 
      width: 100%; 
      height: 100%; 
      background: #070a0f; 
      color: #f1f5f9; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      overflow: hidden; 
    }
    
    /* Mobile First Container */
    .container { 
      width: 100%; 
      max-width: 480px; 
      height: 100dvh; 
      background: #0f172a; 
      display: flex; 
      flex-direction: column; 
      position: relative; 
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }

    .hidden { display: none !important; }

    /* Custom Mobile Scrollbars */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 210, 148, 0.3); border-radius: 10px; }

    /* Mobile Header */
    .header { 
      background: rgba(15, 23, 42, 0.95); 
      backdrop-filter: blur(12px);
      padding: 10px 14px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
      z-index: 5; 
      min-height: 60px;
    }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo-img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #00d294, #00a884); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #0f172a; font-size: 15px; }
    .header h2 { color: #f8fafc; font-size: 15px; font-weight: 700; }
    .header-actions { display: flex; gap: 6px; align-items: center; }
    
    .btn-small { 
      background: rgba(255, 255, 255, 0.08); 
      color: #e2e8f0; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      padding: 6px 10px; 
      border-radius: 16px; 
      cursor: pointer; 
      font-size: 11px; 
      font-weight: 600;
    }
    .btn-danger { background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }

    /* Auth & Profile Screens */
    .center-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 24px; text-align: center; }
    .auth-logo-large { width: 75px; height: 75px; border-radius: 18px; margin-bottom: 12px; box-shadow: 0 8px 20px rgba(0, 210, 148, 0.3); }

    .btn-action { 
      background: linear-gradient(135deg, #00d294 0%, #00a884 100%); 
      color: #0b0f19; 
      border: none; 
      padding: 12px; 
      font-size: 14px; 
      border-radius: 12px; 
      cursor: pointer; 
      font-weight: 700; 
      width: 100%; 
      margin-top: 12px; 
    }
    .btn-google { background: #1e293b; color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: white; margin-top: 8px; }
    
    input[type="text"], input[type="email"], input[type="password"] { 
      width: 100%; 
      padding: 12px 14px; 
      background: #1e293b; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      color: white; 
      border-radius: 12px; 
      margin: 6px 0; 
      outline: none; 
      font-size: 14px;
    }

    .divider { margin: 14px 0; color: #64748b; font-size: 12px; }
    .toggle-link { color: #00d294; cursor: pointer; margin-top: 12px; font-size: 13px; font-weight: 600; }

    /* Search & Users List */
    .search-box { padding: 10px 14px; background: #0f172a; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .search-box input { background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 8px 14px; color: white; width: 100%; font-size: 13px; }
    
    .section-title { padding: 12px 14px 4px 14px; color: #00d294; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .users-list-container { flex: 1; overflow-y: auto; }
    
    .user-card { 
      padding: 12px 14px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.04); 
      cursor: pointer; 
    }
    .user-card:active { background: #1e293b; }
    .user-info { display: flex; align-items: center; gap: 12px; }

    /* Mobile Chat Screen */
    .chat-area { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      z-index: 10; 
      display: flex; 
      flex-direction: column; 
      background: #0a0f1d; 
    }
    
    .messages { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    
    /* Message Bubbles */
    .msg { 
      max-width: 82%; 
      padding: 9px 12px; 
      border-radius: 14px; 
      font-size: 13.5px; 
      line-height: 1.4;
      word-break: break-word; 
      position: relative; 
      display: flex; 
      flex-direction: column; 
      gap: 3px; 
    }
    .msg.sent { background: linear-gradient(135deg, #007a63 0%, #005c4b 100%); align-self: flex-end; color: #f8fafc; border-bottom-right-radius: 2px; }
    .msg.received { background: #1e293b; align-self: flex-start; color: #f8fafc; border-bottom-left-radius: 2px; }
    .msg-time { font-size: 9.5px; color: rgba(255, 255, 255, 0.5); align-self: flex-end; }

    .msg-media { max-width: 100%; border-radius: 8px; margin-top: 4px; max-height: 220px; object-fit: cover; }
    .msg-file-link { display: flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, 0.2); padding: 8px 10px; border-radius: 8px; color: #00d294; text-decoration: none; font-size: 12px; font-weight: 600; }

    /* Input Bar */
    .input-area { padding: 10px 12px; background: #0f172a; display: flex; align-items: center; gap: 8px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .input-area input[type="text"] { margin: 0; flex: 1; background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.08); padding: 10px 14px; border-radius: 20px; color: white; font-size: 13.5px; }
    
    .icon-btn { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; padding: 4px; border-radius: 50%; }
    
    .btn-send-rc { 
      background: linear-gradient(135deg, #00d294 0%, #00a884 100%); 
      color: #0b0f19; 
      border: none; 
      width: 38px; 
      height: 38px; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      font-size: 16px; 
      font-weight: bold; 
      flex-shrink: 0;
    }
    
    #upload-status { font-size: 11px; color: #00d294; padding: 4px 12px; background: #0f172a; text-align: center; font-weight: 600; }

    /* Calling Overlay Modal */
    .call-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      background: #070a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 20px;
    }
    .video-container {
      position: relative;
      width: 100%;
      flex: 1;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      margin: 20px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #remote-video { width: 100%; height: 100%; object-fit: cover; }
    #local-video { position: absolute; bottom: 12px; right: 12px; width: 90px; height: 125px; border-radius: 10px; object-fit: cover; border: 2px solid #00d294; background: #000; }
    .call-controls { display: flex; gap: 24px; align-items: center; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. AUTHENTICATION SCREEN -->
    <div id="auth-screen" class="center-box">
      <img src="logo.png" alt="RishantChat Logo" class="auth-logo-large" onerror="this.style.display='none'" />
      <h1 style="color:#f8fafc; font-size:22px; font-weight:700;">RishantChat</h1>
      <p style="color:#00d294; font-size: 12px; margin-bottom: 20px; font-weight: 600;">PREMIUM MESSENGER</p>

      <input type="email" id="auth-email" placeholder="Email address" />
      <input type="password" id="auth-password" placeholder="Password" />

      <button class="btn-action" id="btn-email-action">Log In</button>
      <p class="toggle-link" id="toggle-auth-mode">Don't have an account? Sign Up</p>

      <div class="divider">OR</div>

      <button class="btn-action btn-google" id="btn-google-login">Continue with Google</button>
    </div>

    <!-- 2. USERNAME SETUP -->
    <div id="username-screen" class="center-box hidden">
      <img src="logo.png" alt="Logo" style="width:55px; height:55px; border-radius:12px; margin-bottom:10px;" />
      <h2>Setup Profile</h2>
      <p style="color:#94a3b8; font-size:12px; margin:6px 0 16px 0;">Choose a unique username</p>
      <input type="text" id="username-input" placeholder="e.g. rishant_01" />
      <button class="btn-action" id="btn-save-username">Save & Continue</button>
    </div>

    <!-- 3. EDIT PROFILE SCREEN -->
    <div id="edit-profile-screen" class="center-box hidden">
      <h2>Edit Profile</h2>
      <p style="color:#94a3b8; font-size:12px; margin:4px 0 14px 0;">Update display name & username</p>
      <input type="text" id="edit-display-name" placeholder="Display Name" />
      <input type="text" id="edit-username" placeholder="Username" />
      <button class="btn-action" id="btn-save-edit-profile">Save Changes</button>
      <button class="btn-action btn-secondary" id="btn-cancel-edit-profile">Cancel</button>
    </div>

    <!-- 4. MAIN CHAT DASHBOARD -->
    <div id="main-screen" class="hidden" style="display:flex; flex-direction:column; height:100%;">
      
      <div class="header">
        <div class="header-brand">
          <img src="logo.png" alt="RishantChat" class="brand-logo-img" />
          <div>
            <h2>RishantChat</h2>
            <small id="my-username-display" style="color:#00d294; font-size: 11px; font-weight: 600;"></small>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn-small" id="btn-open-edit-profile">Edit Profile</button>
          <button class="btn-small btn-danger" id="btn-logout">Logout</button>
        </div>
      </div>

      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search users..." />
      </div>

      <div class="section-title">Direct Messages</div>

      <div id="users-list" class="users-list-container"></div>

      <!-- ACTIVE CHAT WINDOW -->
      <div id="chat-window" class="chat-area hidden">
        <div class="header">
          <div class="header-brand">
            <button class="icon-btn" id="btn-close-chat">←</button>
            <div class="avatar" id="active-user-avatar">?</div>
            <div>
              <h2 id="chat-with-user">User</h2>
              <small style="color:#00d294; font-size:10px; font-weight:600;">● Online</small>
            </div>
          </div>
          <div class="header-actions">
            <button class="icon-btn" id="btn-voice-call" title="Voice Call">📞</button>
            <button class="icon-btn" id="btn-video-call" title="Video Call">📹</button>
          </div>
        </div>
        
        <div class="messages" id="messages-container"></div>

        <div id="upload-status" class="hidden">Uploading media... Please wait</div>

        <input type="file" id="file-input" style="display:none;" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.zip" />

        <div class="input-area">
          <button class="icon-btn" id="btn-attach" title="Attach Media">📎</button>
          <input type="text" id="message-input" placeholder="Type a message..." />
          <button class="btn-send-rc" id="btn-send-msg">➤</button>
        </div>
      </div>
    </div>

    <!-- 5. AUDIO / VIDEO CALL OVERLAY MODAL -->
    <div id="call-modal" class="call-overlay hidden">
      <div style="text-align:center;">
        <h3 id="call-user-title" style="color:#f8fafc; font-size:18px;">@user</h3>
        <p id="call-status" style="color:#00d294; font-size:13px; margin-top:4px;">Calling...</p>
      </div>

      <div class="video-container">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
      </div>

      <div class="call-controls">
        <button id="btn-accept-call" class="btn-send-rc hidden" style="background:#22c55e; width:52px; height:52px; font-size:20px;">📞</button>
        <button id="btn-end-call" class="btn-send-rc" style="background:#ef4444; width:52px; height:52px; font-size:20px;">❌</button>
      </div>
    </div>

  </div>

  <!-- Firebase & WebRTC Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, onAuthStateChanged, signOut 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs, addDoc, orderBy, onSnapshot, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { 
      getStorage, ref, uploadBytes, getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC29TMMQHfUG-UDiXgM14B8K6NVeldft6s",
      authDomain: "rishantchat.firebaseapp.com",
      databaseURL: "https://rishantchat-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "rishantchat",
      storageBucket: "rishantchat.firebasestorage.app",
      messagingSenderId: "1064059813928",
      appId: "1:1064059813928:web:9dbe1561d811501edc351d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentUser = null;
    let currentUserData = null;
    let activeChatUser = null;
    let unsubscribeMessages = null;
    let unsubscribeUsers = null;
    let isSignUpMode = false;

    // WebRTC Calling Setup
    const iceServers = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };
    let peerConnection = null;
    let localStream = null;
    let remoteStream = null;
    let currentCallDocRef = null;

    // --- NOTIFICATIONS (SAFE MOBILE WRAPPER) ---
    function requestNotificationPermission() {
      try {
        if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
          Notification.requestPermission();
        }
      } catch (err) {
        console.log("Notification request skipped:", err);
      }
    }

    function triggerNotification(senderName, text) {
      try {
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification(`RishantChat: @${senderName}`, {
            body: text || "Sent a media file",
            icon: "logo.png"
          });
        }
      } catch (err) {
        console.log("Notification error caught:", err);
      }
    }

    // Auth Mode Switch
    document.getElementById('toggle-auth-mode').addEventListener('click', () => {
      isSignUpMode = !isSignUpMode;
      document.getElementById('btn-email-action').innerText = isSignUpMode ? "Sign Up" : "Log In";
      document.getElementById('toggle-auth-mode').innerText = isSignUpMode ? "Already have an account? Log In" : "Don't have an account? Sign Up";
    });

    // Auth State Observer
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        try {
          const userSnap = await getDoc(doc(db, 'users', user.uid));
          if (userSnap.exists() && userSnap.data().username) {
            currentUserData = userSnap.data();
            showMainScreen();
          } else {
            showUsernameScreen();
          }
        } catch (err) {
          showUsernameScreen();
        }
      } else {
        showAuthScreen();
      }
    });

    // Auth Email Login / Register
    document.getElementById('btn-email-action').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      if (!email || !password) return alert("Enter both email and password!");

      try {
        if (isSignUpMode) {
          await createUserWithEmailAndPassword(auth, email, password);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        alert(err.message);
      }
    });

    // Auth Google Login
    document.getElementById('btn-google-login').addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch (err) {
        alert("Google Login Error: " + err.message);
      }
    });

    // Logout
    document.getElementById('btn-logout').addEventListener('click', () => {
      if (unsubscribeUsers) unsubscribeUsers();
      if (unsubscribeMessages) unsubscribeMessages();
      signOut(auth);
    });

    // Save Initial Username
    document.getElementById('btn-save-username').addEventListener('click', async () => {
      const username = document.getElementById('username-input').value.trim().toLowerCase();
      if (!username) return alert('Enter a username!');

      try {
        const snapshot = await getDocs(query(collection(db, 'users'), where('username', '==', username)));
        if (!snapshot.empty) return alert('Username taken!');

        const userData = { uid: currentUser.uid, username, displayName: currentUser.displayName || username };
        await setDoc(doc(db, 'users', currentUser.uid), userData);
        currentUserData = userData;
        showMainScreen();
      } catch (err) {
        alert(err.message);
      }
    });

    // Edit Profile Handlers
    document.getElementById('btn-open-edit-profile').addEventListener('click', () => showEditProfileScreen());
    document.getElementById('btn-cancel-edit-profile').addEventListener('click', () => showMainScreen());

    document.getElementById('btn-save-edit-profile').addEventListener('click', async () => {
      const newDisplayName = document.getElementById('edit-display-name').value.trim();
      const newUsername = document.getElementById('edit-username').value.trim().toLowerCase();
      if (!newUsername) return alert("Username required!");

      try {
        if (newUsername !== currentUserData.username) {
          const snapshot = await getDocs(query(collection(db, 'users'), where('username', '==', newUsername)));
          if (!snapshot.empty) return alert('Username already taken!');
        }

        const updatedData = { uid: currentUser.uid, displayName: newDisplayName || newUsername, username: newUsername };
        await setDoc(doc(db, 'users', currentUser.uid), updatedData, { merge: true });
        currentUserData = updatedData;
        showMainScreen();
      } catch (err) {
        alert(err.message);
      }
    });

    // Load Users List
    function loadAllUsers() {
      const usersListContainer = document.getElementById('users-list');
      const filterInput = document.getElementById('search-input');

      if (unsubscribeUsers) unsubscribeUsers();

      unsubscribeUsers = onSnapshot(collection(db, 'users'), (snapshot) => {
        renderUsersList(snapshot);
      });

      filterInput.addEventListener('input', () => {
        getDocs(collection(db, 'users')).then(snapshot => renderUsersList(snapshot));
      });

      function renderUsersList(snapshot) {
        usersListContainer.innerHTML = '';
        const filterText = filterInput.value.trim().toLowerCase();

        snapshot.forEach((docSnap) => {
          const user = docSnap.data();
          if (user.uid !== currentUser.uid && user.username) {
            if (!filterText || user.username.toLowerCase().includes(filterText)) {
              const card = document.createElement('div');
              card.className = 'user-card';
              card.innerHTML = `
                <div class="user-info">
                  <div class="avatar">${user.username[0].toUpperCase()}</div>
                  <div>
                    <strong style="font-size:14px; color:#f8fafc;">@${user.username}</strong>
                    <div style="font-size:11px; color:#94a3b8;">${user.displayName || user.username}</div>
                  </div>
                </div>
              `;
              card.addEventListener('click', () => openChat(user.uid, user.username));
              usersListContainer.appendChild(card);
            }
          }
        });
      }
    }

    function getChatId(uid1, uid2) { return uid1 < uid2 ? `${uid1}_${uid2}` : `${uid2}_${uid1}`; }

    function openChat(targetUid, targetUsername) {
      activeChatUser = { uid: targetUid, username: targetUsername };
      document.getElementById('chat-with-user').innerText = `@${targetUsername}`;
      document.getElementById('active-user-avatar').innerText = targetUsername[0].toUpperCase();
      document.getElementById('chat-window').classList.remove('hidden');
      loadMessages();
    }

    document.getElementById('btn-close-chat').addEventListener('click', () => {
      document.getElementById('chat-window').classList.add('hidden');
      if (unsubscribeMessages) unsubscribeMessages();
    });

    // REALTIME CHAT LISTENER (FIXED REALTIME UPDATE BUG)
    function loadMessages() {
      const chatId = getChatId(currentUser.uid, activeChatUser.uid);
      const messagesContainer = document.getElementById('messages-container');

      if (unsubscribeMessages) unsubscribeMessages();

      const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('timestamp', 'asc'));
      let isInitialLoad = true;

      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        // ALWAYS RENDER MESSAGES FIRST (Guarantees Realtime Message Appearance)
        messagesContainer.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const msg = docSnap.data();
          const msgDiv = document.createElement('div');
          msgDiv.className = `msg ${msg.senderId === currentUser.uid ? 'sent' : 'received'}`;
          
          let contentHtml = '';
          if (msg.text) contentHtml += `<div>${msg.text}</div>`;

          if (msg.fileType) {
            if (msg.fileType.startsWith('image/')) {
              contentHtml += `<img src="${msg.fileUrl}" class="msg-media" alt="Photo" />`;
            } else if (msg.fileType.startsWith('video/')) {
              contentHtml += `<video src="${msg.fileUrl}" controls class="msg-media"></video>`;
            } else if (msg.fileType.startsWith('audio/')) {
              contentHtml += `<audio src="${msg.fileUrl}" controls style="margin-top:4px; max-width:200px;"></audio>`;
            } else {
              contentHtml += `<a href="${msg.fileUrl}" target="_blank" class="msg-file-link">📁 ${msg.fileName || 'Download File'}</a>`;
            }
          }

          const timeStr = msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '...';
          contentHtml += `<div class="msg-time">${timeStr}</div>`;

          msgDiv.innerHTML = contentHtml;
          messagesContainer.appendChild(msgDiv);
        });

        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        // SAFE NOTIFICATIONS (Will never freeze/stop UI rendering)
        if (!isInitialLoad) {
          snapshot.docChanges().forEach((change) => {
            if (change.type === "added") {
              const newMsg = change.data();
              if (newMsg.senderId !== currentUser.uid) {
                triggerNotification(activeChatUser.username, newMsg.text);
              }
            }
          });
        }

        isInitialLoad = false;
      }, (err) => {
        console.error("Messages Error:", err);
      });
    }

    // Media File Attach
    document.getElementById('btn-attach').addEventListener('click', () => document.getElementById('file-input').click());

    document.getElementById('file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !activeChatUser) return;

      const uploadStatus = document.getElementById('upload-status');
      uploadStatus.classList.remove('hidden');

      try {
        const chatId = getChatId(currentUser.uid, activeChatUser.uid);
        const storageRef = ref(storage, `chats/${chatId}/${Date.now()}_${file.name}`);
        
        await uploadBytes(storageRef, file);
        const downloadUrl = await getDownloadURL(storageRef);

        await addDoc(collection(db, 'chats', chatId, 'messages'), {
          senderId: currentUser.uid,
          receiverId: activeChatUser.uid,
          text: '',
          fileUrl: downloadUrl,
          fileType: file.type,
          fileName: file.name,
          timestamp: serverTimestamp()
        });
      } catch (err) {
        alert("Upload Error: " + err.message);
      } finally {
        uploadStatus.classList.add('hidden');
        e.target.value = '';
      }
    });

    // Text Message Send
    document.getElementById('btn-send-msg').addEventListener('click', async () => {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !activeChatUser) return;

      const chatId = getChatId(currentUser.uid, activeChatUser.uid);

      try {
        await addDoc(collection(db, 'chats', chatId, 'messages'), {
          senderId: currentUser.uid,
          receiverId: activeChatUser.uid,
          text: text,
          timestamp: serverTimestamp()
        });
        input.value = '';
      } catch (err) {
        alert("Send Error: " + err.message);
      }
    });

    document.getElementById('message-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-send-msg').click();
    });

    // --- WEBRTC CALLING LOGIC ---
    document.getElementById('btn-video-call').onclick = () => startCall(true);
    document.getElementById('btn-voice-call').onclick = () => startCall(false);

    async function startCall(isVideo = true) {
      const chatId = getChatId(currentUser.uid, activeChatUser.uid);
      currentCallDocRef = doc(db, 'calls', chatId);

      peerConnection = new RTCPeerConnection(iceServers);
      localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
      remoteStream = new MediaStream();

      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      document.getElementById('local-video').srcObject = localStream;

      peerConnection.ontrack = (event) => {
        event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
      };
      document.getElementById('remote-video').srcObject = remoteStream;

      const callerCandidates = collection(currentCallDocRef, 'callerCandidates');
      peerConnection.onicecandidate = (e) => { if (e.candidate) addDoc(callerCandidates, e.candidate.toJSON()); };

      const offerDescription = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offerDescription);

      await setDoc(currentCallDocRef, {
        callerId: currentUser.uid,
        receiverId: activeChatUser.uid,
        offer: { type: offerDescription.type, sdp: offerDescription.sdp },
        isVideo: isVideo,
        status: 'ringing'
      });

      document.getElementById('call-modal').classList.remove('hidden');
      document.getElementById('call-user-title').innerText = `@${activeChatUser.username}`;
      document.getElementById('call-status').innerText = `Calling...`;
      document.getElementById('btn-accept-call').classList.add('hidden');

      onSnapshot(currentCallDocRef, (snapshot) => {
        const data = snapshot.data();
        if (data && data.answer && !peerConnection.currentRemoteDescription) {
          peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
          document.getElementById('call-status').innerText = "Connected";
        }
        if (data && data.status === 'ended') endCallUI();
      });

      onSnapshot(collection(currentCallDocRef, 'calleeCandidates'), (snapshot) => {
        snapshot.docChanges().forEach((change) => {
          if (change.type === 'added') peerConnection.addIceCandidate(new RTCIceCandidate(change.data()));
        });
      });
    }

    function listenForIncomingCalls() {
      const q = query(
        collection(db, 'calls'), 
        where('receiverId', '==', currentUser.uid)
      );
      
      onSnapshot(q, (snapshot) => {
        snapshot.docChanges().forEach((change) => {
          if (change.type === 'added' || change.type === 'modified') {
            const callData = change.data();

            if (callData.status === 'ringing') {
              currentCallDocRef = change.doc.ref;

              document.getElementById('call-modal').classList.remove('hidden');
              document.getElementById('call-user-title').innerText = `Incoming Call`;
              document.getElementById('call-status').innerText = `${callData.isVideo ? 'Video' : 'Voice'} Call Ringing...`;
              
              const acceptBtn = document.getElementById('btn-accept-call');
              acceptBtn.classList.remove('hidden');

              acceptBtn.onclick = () => answerCall(callData);
            }
          }
        });
      });
    }

    async function answerCall(callData) {
      peerConnection = new RTCPeerConnection(iceServers);
      localStream = await navigator.mediaDevices.getUserMedia({ video: callData.isVideo, audio: true });
      remoteStream = new MediaStream();

      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      document.getElementById('local-video').srcObject = localStream;

      peerConnection.ontrack = (e) => { e.streams[0].getTracks().forEach(track => remoteStream.addTrack(track)); };
      document.getElementById('remote-video').srcObject = remoteStream;

      const calleeCandidates = collection(currentCallDocRef, 'calleeCandidates');
      peerConnection.onicecandidate = (e) => { if (e.candidate) addDoc(calleeCandidates, e.candidate.toJSON()); };

      await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
      const answerDescription = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answerDescription);

      await setDoc(currentCallDocRef, {
        answer: { type: answerDescription.type, sdp: answerDescription.sdp },
        status: 'connected'
      }, { merge: true });

      document.getElementById('call-status').innerText = "Connected";
      document.getElementById('btn-accept-call').classList.add('hidden');

      onSnapshot(collection(currentCallDocRef, 'callerCandidates'), (snapshot) => {
        snapshot.docChanges().forEach((change) => {
          if (change.type === 'added') peerConnection.addIceCandidate(new RTCIceCandidate(change.data()));
        });
      });
    }

    document.getElementById('btn-end-call').addEventListener('click', async () => {
      if (currentCallDocRef) await setDoc(currentCallDocRef, { status: 'ended' }, { merge: true });
      endCallUI();
    });

    function endCallUI() {
      if (localStream) localStream.getTracks().forEach(track => track.stop());
      if (peerConnection) peerConnection.close();
      peerConnection = null;
      localStream = null;
      remoteStream = null;
      document.getElementById('call-modal').classList.add('hidden');
    }

    // Screen Management
    function hideAllScreens() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('username-screen').classList.add('hidden');
      document.getElementById('edit-profile-screen').classList.add('hidden');
      document.getElementById('main-screen').classList.add('hidden');
    }

    function showAuthScreen() {
      hideAllScreens();
      document.getElementById('auth-screen').classList.remove('hidden');
    }

    function showUsernameScreen() {
      hideAllScreens();
      document.getElementById('username-screen').classList.remove('hidden');
    }

    function showEditProfileScreen() {
      hideAllScreens();
      document.getElementById('edit-profile-screen').classList.remove('hidden');
      document.getElementById('edit-display-name').value = currentUserData?.displayName || '';
      document.getElementById('edit-username').value = currentUserData?.username || '';
    }

    function showMainScreen() {
      hideAllScreens();
      document.getElementById('main-screen').classList.remove('hidden');
      document.getElementById('my-username-display').innerText = `@${currentUserData.username}`;
      
      requestNotificationPermission();
      loadAllUsers();
      listenForIncomingCalls();
    }
  </script>
</body>
</html>

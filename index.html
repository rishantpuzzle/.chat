<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rishant Chat</title>

  <!-- HOTEL APP FAVICON -->
    <link rel="icon"
          type="image/png"
          href="logo.png">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #0c1317; color: #e9edef; display: flex; justify-content: center; align-items: center; height: 100vh; }
    
    .container { width: 100%; max-width: 450px; height: 100vh; background: #111b21; display: flex; flex-direction: column; border: 1px solid #222d34; position: relative; }
    .hidden { display: none !important; }

    /* Header */
    .header { background: #202c33; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222d34; }
    .header h2 { color: #00a884; font-size: 20px; }
    .header-actions { display: flex; gap: 8px; }
    .btn-small { background: #2a3942; color: #e9edef; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-danger { background: #e53935; color: white; }

    /* Auth & Profile Forms */
    .center-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 25px; text-align: center; }
    .btn-action { background: #00a884; color: white; border: none; padding: 12px; font-size: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    .btn-google { background: #4285f4; }
    .btn-secondary { background: #3b4a54; margin-top: 5px; }
    
    input[type="text"], input[type="email"], input[type="password"] { 
      width: 100%; padding: 12px; background: #2a3942; border: 1px solid #3b4a54; color: white; border-radius: 8px; margin: 6px 0; outline: none; font-size: 14px;
    }

    .divider { margin: 15px 0; color: #8696a0; font-size: 13px; }
    .toggle-link { color: #00a884; cursor: pointer; margin-top: 12px; font-size: 14px; text-decoration: underline; }

    /* User List Section */
    .section-title { padding: 10px 15px 5px 15px; color: #00a884; font-size: 14px; font-weight: bold; }
    .users-list-container { flex: 1; overflow-y: auto; padding-bottom: 10px; }
    .user-card { background: #202c33; padding: 12px; margin: 6px 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }

    /* Chat Area */
    .chat-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; background: #0b141a; }
    .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; word-break: break-word; }
    .msg.sent { background: #005c4b; align-self: flex-end; color: #e9edef; }
    .msg.received { background: #202c33; align-self: flex-start; color: #e9edef; }

    .input-area { padding: 10px; background: #202c33; display: flex; gap: 10px; }
    .input-area input { margin: 0; flex: 1; }
    .btn-send { background: #00a884; border: none; color: white; padding: 0 18px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. AUTHENTICATION SCREEN -->
    <div id="auth-screen" class="center-box">
      <h1 style="color:#00a884; margin-bottom: 5px;">Rishant Chat</h1>
      <p style="color:#8696a0; font-size: 13px; margin-bottom: 15px;">Sign in with Email or Google</p>

      <input type="email" id="auth-email" placeholder="Email Address" />
      <input type="password" id="auth-password" placeholder="Password" />

      <button class="btn-action" id="btn-email-action">Login</button>
      
      <p class="toggle-link" id="toggle-auth-mode">Don't have an account? Sign Up</p>

      <div class="divider">--- OR ---</div>

      <button class="btn-action btn-google" id="btn-google-login">Sign in with Google</button>
    </div>

    <!-- 2. INITIAL USERNAME SETUP SCREEN -->
    <div id="username-screen" class="center-box hidden">
      <h2>Create Username</h2>
      <p style="color:#8696a0; font-size:13px; margin:5px 0 15px 0;">Your email address will remain hidden from other users.</p>
      <input type="text" id="username-input" placeholder="e.g. rishant_king" />
      <button class="btn-action" id="btn-save-username">Save & Continue</button>
    </div>

    <!-- 3. EDIT PROFILE SCREEN -->
    <div id="edit-profile-screen" class="center-box hidden">
      <h2>Edit Profile</h2>
      <p style="color:#8696a0; font-size:13px; margin:5px 0 15px 0;">Update your account information</p>
      
      <label style="align-self: flex-start; font-size:12px; color:#8696a0; margin-top:5px;">Display Name</label>
      <input type="text" id="edit-display-name" placeholder="Display Name" />
      
      <label style="align-self: flex-start; font-size:12px; color:#8696a0; margin-top:5px;">Username</label>
      <input type="text" id="edit-username" placeholder="Username" />
      
      <button class="btn-action" id="btn-save-edit-profile">Save Changes</button>
      <button class="btn-action btn-secondary" id="btn-cancel-edit-profile">Cancel</button>
    </div>

    <!-- 4. MAIN CHAT DASHBOARD -->
    <div id="main-screen" class="hidden" style="display:flex; flex-direction:column; height:100%;">
      <div class="header">
        <div>
          <h2>Rishant Chat</h2>
          <small id="my-username-display" style="color:#8696a0;"></small>
        </div>
        <div class="header-actions">
          <button class="btn-small" id="btn-open-edit-profile">Edit Profile</button>
          <button class="btn-small btn-danger" id="btn-logout">Logout</button>
        </div>
      </div>

      <!-- Quick Filter Bar -->
      <div style="padding: 10px 12px 5px 12px;">
        <input type="text" id="search-input" placeholder="Filter users..." style="margin:0;" />
      </div>

      <div class="section-title">All Users</div>

      <!-- Auto-Loaded All Users List -->
      <div id="users-list" class="users-list-container"></div>

      <!-- Active Chat Window -->
      <div id="chat-window" class="chat-area hidden">
        <div class="header">
          <span id="chat-with-user" style="font-weight:bold;"></span>
          <button style="background:none; border:none; color:#8696a0; cursor:pointer; font-size:18px;" id="btn-close-chat">✖</button>
        </div>
        
        <div class="messages" id="messages-container"></div>

        <div class="input-area">
          <input type="text" id="message-input" placeholder="Type a message..." />
          <button class="btn-send" id="btn-send-msg">Send</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      collection, 
      query, 
      where, 
      getDocs, 
      addDoc, 
      orderBy, 
      onSnapshot, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC29TMMQHfUG-UDiXgM14B8K6NVeldft6s",
      authDomain: "rishantchat.firebaseapp.com",
      databaseURL: "https://rishantchat-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "rishantchat",
      storageBucket: "rishantchat.firebasestorage.app",
      messagingSenderId: "1064059813928",
      appId: "1:1064059813928:web:9dbe1561d811501edc351d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentUserData = null;
    let activeChatUser = null;
    let unsubscribeMessages = null;
    let unsubscribeUsers = null;
    let isSignUpMode = false;

    // Toggle Sign In / Sign Up Mode
    document.getElementById('toggle-auth-mode').addEventListener('click', () => {
      isSignUpMode = !isSignUpMode;
      const btn = document.getElementById('btn-email-action');
      const toggle = document.getElementById('toggle-auth-mode');
      if (isSignUpMode) {
        btn.innerText = "Sign Up";
        toggle.innerText = "Already have an account? Log In";
      } else {
        btn.innerText = "Login";
        toggle.innerText = "Don't have an account? Sign Up";
      }
    });

    // Auth State Observer
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        try {
          const userDocRef = doc(db, 'users', user.uid);
          const userSnap = await getDoc(userDocRef);

          if (userSnap.exists() && userSnap.data().username) {
            currentUserData = userSnap.data();
            showMainScreen();
          } else {
            showUsernameScreen();
          }
        } catch (err) {
          console.error("Firestore Error:", err);
          alert("Database Error: " + err.message);
          showUsernameScreen();
        }
      } else {
        showAuthScreen();
      }
    });

    // Email/Password Authentication
    document.getElementById('btn-email-action').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();

      if (!email || !password) return alert("Please enter both email and password!");

      try {
        if (isSignUpMode) {
          await createUserWithEmailAndPassword(auth, email, password);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        alert("Authentication Error: " + err.message);
      }
    });

    // Google Login
    document.getElementById('btn-google-login').addEventListener('click', async () => {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert("Google Login Error: " + err.message);
      }
    });

    // Logout
    document.getElementById('btn-logout').addEventListener('click', () => {
      if (unsubscribeUsers) unsubscribeUsers();
      if (unsubscribeMessages) unsubscribeMessages();
      signOut(auth);
    });

    // Save Initial Username
    document.getElementById('btn-save-username').addEventListener('click', async () => {
      const username = document.getElementById('username-input').value.trim().toLowerCase();
      if (!username) return alert('Please enter a username!');

      try {
        const q = query(collection(db, 'users'), where('username', '==', username));
        const snapshot = await getDocs(q);

        if (!snapshot.empty) {
          return alert('This username is already taken! Please choose another one.');
        }

        const userData = {
          uid: currentUser.uid,
          username: username,
          displayName: currentUser.displayName || username
        };

        await setDoc(doc(db, 'users', currentUser.uid), userData);
        currentUserData = userData;
        showMainScreen();
      } catch (err) {
        alert("Error saving username: " + err.message);
      }
    });

    // Edit Profile Navigation
    document.getElementById('btn-open-edit-profile').addEventListener('click', () => showEditProfileScreen());
    document.getElementById('btn-cancel-edit-profile').addEventListener('click', () => showMainScreen());

    // Save Profile Updates
    document.getElementById('btn-save-edit-profile').addEventListener('click', async () => {
      const newDisplayName = document.getElementById('edit-display-name').value.trim();
      const newUsername = document.getElementById('edit-username').value.trim().toLowerCase();

      if (!newUsername) return alert("Username cannot be empty!");

      try {
        if (newUsername !== currentUserData.username) {
          const q = query(collection(db, 'users'), where('username', '==', newUsername));
          const snapshot = await getDocs(q);
          if (!snapshot.empty) {
            return alert('Username is already taken!');
          }
        }

        const updatedData = {
          uid: currentUser.uid,
          displayName: newDisplayName || newUsername,
          username: newUsername
        };

        await setDoc(doc(db, 'users', currentUser.uid), updatedData, { merge: true });
        currentUserData = updatedData;
        alert("Profile updated successfully!");
        showMainScreen();
      } catch (err) {
        alert("Error updating profile: " + err.message);
      }
    });

    // AUTO-LOAD ALL REGISTERED USERS (Realtime Listener)
    function loadAllUsers() {
      const usersListContainer = document.getElementById('users-list');
      const filterInput = document.getElementById('search-input');

      if (unsubscribeUsers) unsubscribeUsers();

      // Listen to all users in real-time
      unsubscribeUsers = onSnapshot(collection(db, 'users'), (snapshot) => {
        renderUsersList(snapshot);
      });

      filterInput.addEventListener('input', () => {
        getDocs(collection(db, 'users')).then(snapshot => renderUsersList(snapshot));
      });

      function renderUsersList(snapshot) {
        usersListContainer.innerHTML = '';
        const filterText = filterInput.value.trim().toLowerCase();
        let count = 0;

        snapshot.forEach((docSnap) => {
          const user = docSnap.data();

          // Don't show self and must have a valid username
          if (user.uid !== currentUser.uid && user.username) {
            if (!filterText || user.username.toLowerCase().includes(filterText) || (user.displayName && user.displayName.toLowerCase().includes(filterText))) {
              count++;
              const card = document.createElement('div');
              card.className = 'user-card';
              card.innerHTML = `
                <div>
                  <strong>@${user.username}</strong>
                  <div style="font-size:12px; color:#8696a0;">${user.displayName || user.username}</div>
                </div>
                <button class="btn-send" style="padding:6px 14px;">Chat</button>
              `;
              card.querySelector('button').addEventListener('click', () => openChat(user.uid, user.username));
              usersListContainer.appendChild(card);
            }
          }
        });

        if (count === 0) {
          usersListContainer.innerHTML = '<div style="color:#8696a0; text-align:center; padding:20px; font-size:13px;">No other users found.</div>';
        }
      }
    }

    // Chat Window Helpers
    function getChatId(uid1, uid2) {
      return uid1 < uid2 ? `${uid1}_${uid2}` : `${uid2}_${uid1}`;
    }

    function openChat(targetUid, targetUsername) {
      activeChatUser = { uid: targetUid, username: targetUsername };
      document.getElementById('chat-with-user').innerText = `@${targetUsername}`;
      document.getElementById('chat-window').classList.remove('hidden');
      loadMessages();
    }

    document.getElementById('btn-close-chat').addEventListener('click', () => {
      document.getElementById('chat-window').classList.add('hidden');
      if (unsubscribeMessages) unsubscribeMessages();
    });

    // Load Realtime Messages
    function loadMessages() {
      const chatId = getChatId(currentUser.uid, activeChatUser.uid);
      const messagesContainer = document.getElementById('messages-container');

      if (unsubscribeMessages) unsubscribeMessages();

      const q = query(
        collection(db, 'chats', chatId, 'messages'),
        orderBy('timestamp', 'asc')
      );

      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        messagesContainer.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const msg = docSnap.data();
          const msgDiv = document.createElement('div');
          msgDiv.className = `msg ${msg.senderId === currentUser.uid ? 'sent' : 'received'}`;
          msgDiv.innerText = msg.text;
          messagesContainer.appendChild(msgDiv);
        });
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      });
    }

    // Send Message
    document.getElementById('btn-send-msg').addEventListener('click', async () => {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !activeChatUser) return;

      const chatId = getChatId(currentUser.uid, activeChatUser.uid);

      try {
        await addDoc(collection(db, 'chats', chatId, 'messages'), {
          senderId: currentUser.uid,
          receiverId: activeChatUser.uid,
          text: text,
          timestamp: serverTimestamp()
        });
        input.value = '';
      } catch (err) {
        alert("Failed to send message: " + err.message);
      }
    });

    // Screen Navigation Functions
    function hideAllScreens() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('username-screen').classList.add('hidden');
      document.getElementById('edit-profile-screen').classList.add('hidden');
      document.getElementById('main-screen').classList.add('hidden');
    }

    function showAuthScreen() {
      hideAllScreens();
      document.getElementById('auth-screen').classList.remove('hidden');
    }

    function showUsernameScreen() {
      hideAllScreens();
      document.getElementById('username-screen').classList.remove('hidden');
    }

    function showEditProfileScreen() {
      hideAllScreens();
      document.getElementById('edit-profile-screen').classList.remove('hidden');
      document.getElementById('edit-display-name').value = currentUserData?.displayName || '';
      document.getElementById('edit-username').value = currentUserData?.username || '';
    }

    function showMainScreen() {
      hideAllScreens();
      document.getElementById('main-screen').classList.remove('hidden');
      document.getElementById('my-username-display').innerText = `@${currentUserData.username}`;
      loadAllUsers(); // Automatically load all registered users
    }
  </script>
</body>
</html>
